spring:
  application:
    name: muriox
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:postgresql://localhost:5432/muriox
    username: postgres
    password: postgres
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      schema: public
app:
  authority-cache:
    ttl: 30m
  jwt:
    issuer: muriox
    access-token-ttl: 30m
    public-key: classpath:keys/jwt-public.pem
    private-key: classpath:keys/jwt-private.pem
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:muriox}
    secret-key: ${MINIO_SECRET_KEY:Muriox@2026Dev}
    bucket: ${MINIO_BUCKET:muriox}
    presigned-url-ttl: 30m
